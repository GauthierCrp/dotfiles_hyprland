# ==============================================================================
# CONFIGURATION KITTY - HYPRLAND / DEBIAN
# ==============================================================================

# --- Police de caractères ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Transparence et Fenêtre ---
background_opacity         0.82
dynamic_background_opacity yes
window_padding_width       12
confirm_os_window_close    0

# --- Curseur ---
cursor_shape               beam
cursor_blink_interval      0.6

# --- Barre d'onglets (Minimaliste) ---
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
active_tab_font_style      bold

# ==============================================================================
# PALETTE DE COULEURS (Thème Sombre & Sobre)
# ==============================================================================

# Couleurs principales
foreground           #c0caf5
background           #1a1b26
selection_foreground #1a1b26
selection_background #7aa2f7

# Curseur
cursor               #c0caf5
cursor_text_color    #1a1b26

# Onglets
active_tab_foreground   #15161e
active_tab_background   #7aa2f7
inactive_tab_foreground #565f89
inactive_tab_background #1f2335

# Couleurs des fenêtres de séparation
active_border_color   #7aa2f7
inactive_border_color #292e42

# --- Palette ANSI (16 Couleurs) ---

# Noir
color0 #15161e
color8 #414868

# Rouge
color1 #f7768e
color9 #f7768e

# Vert
color2  #9ece6a
color10 #9ece6a

# Jaune / Orange
color3  #e0af68
color11 #e0af68

# Bleu
color4  #7aa2f7
color12 #7aa2f7

# Magenta / Violet
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# Blanc
color7  #a9b1d6
color15 #c0caf5
